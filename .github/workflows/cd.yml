name: CD

on:
  workflow_run:
    workflows: ["CI"]  # must match your CI workflow name
    types: [completed] # completed does NOT mean successful.

env:
  IMAGE_NAME: turbine-anomaly # docker image name in docker hub

jobs:
  build-and-push:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Buildx enables advanced Docker builds (caching, multi-platform, and `buildx --push`).
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # build and push docker image based on the Dockerfile in the repo
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to DigitalOcean
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          command_timeout: 60m
          script: |
            set -e
            cd turbine-anomaly-detector

            git pull origin main
            
            export DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            export KEDRO_VIZ_URI=http://${{ secrets.DO_HOST }}:4141
            export MLFLOW_UI_URI=http://${{ secrets.DO_HOST }}:8080
            export PREFECT_UI_URL='http://${{ secrets.DO_HOST }}:4200'
            export PREFECT_API_URL='http://${{ secrets.DO_HOST }}:4200/api'
            export PREFECT_UI_API_URL='http://${{ secrets.DO_HOST }}:4200/api'

            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            for attempt in 1 2 3; do
              if docker compose --progress plain --parallel 1 pull; then
                break
              fi

              if [ "$attempt" -eq 3 ]; then
                exit 1
              fi

              sleep 30
            done

            docker compose up -d --remove-orphans

