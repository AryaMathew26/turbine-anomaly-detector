services:
  # =============================================================================
  # DATA STREAMING SERVICE
  # =============================================================================
  app-stream-data:
    # OR build: .
    build:
      context: .
      dockerfile: Dockerfile
    image: turbine-anomaly-detector:latest
    command: ["python", "entrypoints/app_stream_data.py"]
    volumes:
      - ./data:/app/data
      - ./conf:/app/conf
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  prefect-db:
    image: postgres:16
    environment:
      POSTGRES_USER: prefect
      POSTGRES_PASSWORD: prefect
      POSTGRES_DB: prefect
    volumes:
      - prefect_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prefect -d prefect"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  prefect-server:
    # The ARM64 3.7.8 standard image contains zero-byte libsqlite3 files.
    # The equivalent Conda image uses a healthy SQLite runtime.
    image: prefecthq/prefect:3.7.8-python3.12-conda
    # image: prefecthq/prefect:3-latest
    command: prefect server start --host 0.0.0.0
    ports:
      - "4200:4200"
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://prefect:prefect@prefect-db:5432/prefect
    depends_on:
      prefect-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:4200/api/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  mlflow_server:
    image: turbine-anomaly-detector:latest
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --backend-store-uri
      - sqlite:////app/mlflow/mlflow.db
      - --default-artifact-root
      - file:///app/mlflow/artifacts
      - --serve-artifacts
      - --allowed-hosts
      - "*"
      - --cors-allowed-origins
      - "*"
    ports:
      - "8080:8080"
    volumes:
      - ./mlflow_docker:/app/mlflow
      - ./data:/app/data
      - ./conf:/app/conf
      
  app-ml-train:
    image: turbine-anomaly-detector:latest
    command: ["python", "entrypoints/prefect/training.py"] # ["python", "entrypoints/training.py"]
    volumes:
      - ./mlflow_docker:/app/mlflow
      - ./data:/app/data
      - ./conf:/app/conf
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow_server:8080
      - PREFECT_API_URL=http://prefect-server:4200/api
    depends_on:
      mlflow_server:
        condition: service_started
      app-stream-data:
        condition: service_started
      prefect-server:
        condition: service_healthy

  app-ml-inference:
    image: turbine-anomaly-detector:latest
    command: ["python", "entrypoints/prefect/inference.py"] # ["python", "entrypoints/inference_real_time.py"]
    volumes:
      - ./mlflow_docker:/app/mlflow
      - ./data:/app/data
      - ./conf:/app/conf
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow_server:8080
      - PREFECT_API_URL=http://prefect-server:4200/api
    depends_on:
      app-ml-train:
        # condition: service_completed_successfully
        condition: service_started
      mlflow_server:
        condition: service_started
      prefect-server:
        condition: service_healthy

  app-ml-monitoring:
    image: turbine-anomaly-detector:latest
    command: ["python", "entrypoints/prefect/monitoring.py"]
    restart: unless-stopped
    volumes:
      - ./mlflow_docker:/app/mlflow
      - ./data:/app/data
      - ./conf:/app/conf
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow_server:8080
      - PREFECT_API_URL=http://prefect-server:4200/api 
    depends_on:
      app-ml-train:
        condition: service_started
      mlflow_server:
        condition: service_started
      prefect-server:
        condition: service_healthy  

  app-ui:
    image: turbine-anomaly-detector:latest
    command: ["python", "entrypoints/app_ui.py"]  # Run the Dash UI app
    ports:
      - "8050:8050"                 # Expose port 8050 for web access
    volumes:
      - ./mlflow_docker:/app/mlflow
      - ./data:/app/data
      - ./conf:/app/conf
    environment:
      - KEDRO_ENV=local
      - MLFLOW_TRACKING_URI=http://mlflow_server:8080
      - MLFLOW_UI_URI=${MLFLOW_UI_URI:-http://localhost:8080}
      - DEBUG=False
      - KEDRO_VIZ_URI=${KEDRO_VIZ_URI:-http://localhost:4141}
    depends_on:
      - mlflow_server
      - app-stream-data

  kedro-viz:
    image: turbine-anomaly-detector:latest
    command: ["kedro", "viz", "run", "--host", "0.0.0.0", "--port", "4141"]
    ports:
      - "4141:4141"                 # Expose port 4141 for Kedro Viz UI

volumes:
  prefect_db_data:
